[package]
name = "libafl_qemu_asan_host"
version.workspace = true
edition.workspace = true
rust-version.workspace = true

[lib]
name = "afl_qemu_asan_host"
crate-type = ["staticlib"]

[features]
default = []
test = ["libafl_asan/test", "libafl_asan_libc/test"]

[dependencies]
libafl_asan = { path = "../../../libafl_asan", default-features = false, features = [
  "dlmalloc",
  "global_allocator",
  "hooks",
  "host",
  "libc",
  "mimalloc",
  "tracking",
  "nostd",
] }
libafl_asan_libc = { path = "../../../libafl_asan/libafl_asan_libc", default-features = false }
libc = { version = "0.2.189", default-features = false }
log = { version = "0.4.33", default-features = false, features = [
  "release_max_level_info",
] }
spin = { version = "0.12.2", default-features = false, features = [
  "lazy",
  "mutex",
  "spin_mutex",
] }
