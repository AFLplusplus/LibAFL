[package]
name = "libafl_nyx"
version.workspace = true
edition = "2024"
authors = ["syheliel <syheliel@gmail.com>"]
description = "libafl using nyx, only avaliable on linux"
documentation = "https://docs.rs/libafl_nyx"
repository = "https://github.com/AFLplusplus/LibAFL/"
readme = "./README.md"
license = "MIT OR Apache-2.0"
keywords = ["fuzzing", "testing", "security"]
categories = [
  "development-tools::testing",
  "emulators",
  "embedded",
  "os",
  "no-std",
]

# `libafl_nyx` and its `libnyx` dependency are linux-only, and `libnyx`'s build script
# requires network access, which is unavailable in the offline docs.rs sandbox. Build the
# documentation on a non-linux target so the crate-level docs (README) are generated
# successfully; the linux-only API is `cfg`-gated and therefore not shown on docs.rs.
[package.metadata.docs.rs]
default-target = "x86_64-apple-darwin"

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[target.'cfg(target_os = "linux")'.dependencies]
libnyx = "0.1.3"
libafl = { workspace = true, default-features = true, features = [
  "std",
  "libafl_derive",
  "frida_cli",
] }
libafl_bolts = { workspace = true, default-features = true, features = [
  "std",
  "libafl_derive",
  "frida_cli",
] }
libafl_targets = { workspace = true, default-features = true, features = [
  "std",
  "sancov_cmplog",
] }

nix = { workspace = true, default-features = true, features = ["fs"] }
typed-builder = { workspace = true }
regex = "1.13.1"
serde = { workspace = true, default-features = false, features = [
  "alloc",
] } # serialization lib

[lints]
workspace = true
