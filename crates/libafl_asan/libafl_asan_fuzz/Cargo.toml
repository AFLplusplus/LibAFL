[package]
name = "libafl_asan_fuzz"
version.workspace = true
edition = "2024"
rust-version = "1.93.1"
publish = false

[package.metadata]
cargo-fuzz = true

[dependencies]
libafl_asan = { path = "../", default-features = false, features = [
  "dlmalloc",
  "guest",
  "host",
  "libc",
  "syscalls",
  "test",
  "tracking",
] }
env_logger = { version = "0.11.11" }
libfuzzer-sys = { version = "0.4" }
log = { version = "0.4.33", features = ["release_max_level_info"] }
mockall = { version = "0.15.0" }
thiserror = { version = "2.0.19" }

[[bin]]
name = "guest_shadow"
path = "fuzz_targets/guest_shadow.rs"
test = false
doc = false
bench = false

[[bin]]
name = "guest_tracking"
path = "fuzz_targets/guest_tracking.rs"
test = false
doc = false
bench = false

[[bin]]
name = "default_frontend_mock"
path = "fuzz_targets/default_frontend_mock.rs"
test = false
doc = false
bench = false

[[bin]]
name = "default_frontend_dlmalloc"
path = "fuzz_targets/default_frontend_dlmalloc.rs"
test = false
doc = false
bench = false
