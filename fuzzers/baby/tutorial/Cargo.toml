[package]
name = "tutorial"
version = "0.16.0"
authors = [
  "Andrea Fioraldi <andreafioraldi@gmail.com>",
  "Dominik Maier <domenukk@gmail.com>",
]
edition = "2021"

[features]
default = ["std"]
std = []

[profile.release]
lto = true
codegen-units = 1
opt-level = 3
debug = true

[build-dependencies]
cc = { version = "1.4.0", features = ["parallel"] }
which = "8.0.5"

[dependencies]
libafl = { path = "../../../crates/libafl", features = [
  "default",
  "rand_trait",
] }
libafl_bolts = { path = "../../../crates/libafl_bolts" }
libafl_targets = { path = "../../../crates/libafl_targets", features = [
  "sancov_pcguard_hitcounts",
  "libfuzzer",
  "sancov_cmplog",
] }
serde = { version = "1.0.229", default-features = false, features = [
  "alloc",
] } # serialization lib
lain = { version = "0.5.6", features = [
  "serde_support",
], git = "https://github.com/AFLplusplus/lain.git" }
# TODO Include it only when building cc
libafl_cc = { path = "../../../crates/libafl_cc" }

[lib]
name = "tutorial"
crate-type = ["staticlib"]
