[package]
name = "qemu_cmin"
version = "0.16.0"
authors = [
  "Andrea Fioraldi <andreafioraldi@gmail.com>",
  "Dominik Maier <domenukk@gmail.com>",
  "WorksButNotTested",
]
edition = "2021"

[profile.release]
#lto = true
#codegen-units = 1
#opt-level = 3
debug = true

[features]
default = ["std", "fork"]
fork = []
snapshot = []
std = []
be = ["libafl_qemu/be"]
arm = ["libafl_qemu/arm"]
x86_64 = ["libafl_qemu/x86_64"]
i386 = ["libafl_qemu/i386"]
aarch64 = ["libafl_qemu/aarch64"]
mips = ["libafl_qemu/mips"]
ppc = ["libafl_qemu/ppc", "be"]

[build-dependencies]
vergen = { version = "10.0.1", features = ["build", "cargo", "rustc", "si"] }
vergen-git2 = "10.0.1"

[dependencies]
clap = { version = "4.6.4", features = ["derive", "string"] }
env_logger = { version = "0.11.11" }
libafl = { path = "../../../crates/libafl" }
libafl_bolts = { path = "../../../crates/libafl_bolts" }
libafl_qemu = { path = "../../../crates/libafl_qemu", features = ["usermode"] }
libafl_targets = { path = "../../../crates/libafl_targets" }
log = { version = "0.4.33", features = ["release_max_level_info"] }
mimalloc = "0.1.52"
scudo = "0.1.3"
