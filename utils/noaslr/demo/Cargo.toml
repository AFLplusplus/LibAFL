[package]
name = "noaslr_demo"
version = "0.16.1"
edition = "2024"

[build-dependencies]
vergen = { version = "10.0.1", features = ["build", "cargo", "rustc", "si"] }
vergen-git2 = "10.0.1"

[dependencies]
anyhow = { version = "1.0", default-features = false }
clap = { version = "4.5", default-features = false, features = [
  "derive",
  "string",
  "std",
  "help",
] }
readonly = { version = "0.2.8", default-features = false }
